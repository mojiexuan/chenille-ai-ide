name: Chenille Isolation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'upgrade/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolation:
    name: Upstream Isolation
    runs-on: ubuntu-24.04
    steps:
      # Full history is required to locate the vendor baseline commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check upstream isolation
        run: node scripts/chenille/check-isolation.mjs
